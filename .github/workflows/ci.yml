name: CI

on:
  push:
    branches: [main, workbench-v3]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for release-drift (latest release by default)"
        required: false
        default: "release-2026-11-15"
        type: string
  schedule:
    # Nightly full gate.  The release-nightly-gate job stays skipped unless the
    # BINARYREPAIR_RELEASE_GATE repository variable is set to "true" (see that
    # job's comment); the schedule alone does not claim a nightly run happened.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system assembler
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Static syntax gate (no dependencies)
        run: python scripts/check_static_syntax.py
      - name: CI evidence claims (offline)
        run: python scripts/verify_ci_evidence.py
      - name: Language policy (Python comments/docstrings must be ASCII)
        run: python scripts/check_language_policy.py
      - name: Test serialization policy (CI pytest must pass -p no:xdist)
        run: python scripts/verify_test_serial.py
      - name: Markdown language policy (release docs are ASCII/English)
        run: >-
          python scripts/check_markdown_language.py --json
          --allowlist docs/operations/markdown-language-allowlist.json
      - name: Flake policy (no rerun-as-pass; serial flake governance)
        run: python scripts/check_flake_policy.py --json
      - name: Universe methodology check (three-state matrix invariants)
        run: python scripts/check_universe_methodology.py --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # Lima/guest-touching suites must stay serial: one guest at a time.
      - name: Run non-browser tests (serial; xdist explicitly disabled)
        run: python -m pytest -q -p no:xdist --ignore=tests/e2e
  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Language policy (Python comments/docstrings must be ASCII)
        run: python scripts/check_language_policy.py
      - name: Test serialization policy (CI pytest must pass -p no:xdist)
        run: python scripts/verify_test_serial.py
      - name: Markdown language policy (release docs are ASCII/English)
        run: >-
          python scripts/check_markdown_language.py --json
          --allowlist docs/operations/markdown-language-allowlist.json
      - name: Flake policy (no rerun-as-pass; serial flake governance)
        run: python scripts/check_flake_policy.py --json
      - name: Universe methodology check (three-state matrix invariants)
        run: python scripts/check_universe_methodology.py --check
      - name: Coverage regression gate (static, no network)
        run: python scripts/verify_coverage_gate.py --static-only
      # Serial execution by policy: Lima guests and the real PoC differential are
      # single-instance resources; -p no:xdist keeps the run serial even if a
      # parallel plugin is installed in the environment.
      - name: Coverage gate + capability audit tests (serial)
        run: python -m pytest -q -p no:xdist tests/test_coverage_gate.py tests/test_capability_audit.py

  release-gate-pr:
    # Fast PR cost layer (scripts/release_gate.py --pr): static coverage gate +
    # measured claims/measurement diff + targeted pytest subset.  This is not a
    # release claim: --release additionally needs the local probe gate, the
    # real-guest acceptance capture, meta-audit/invariants, the provider-matrix
    # artifact and the full suite.  The gate exits non-zero on any violation.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # The gate runs its targeted pytest subset with -p no:xdist (serial);
      # no test in this layer touches a Lima guest in parallel.
      - name: Staged PR gate
        run: python scripts/release_gate.py --pr --json

  release-gate-hosted:
    # Portable GitHub-hosted CI evidence.  The full release gate measures
    # host-specific capability tiers (Linux/macOS probes, Lima guest) and is
    # recorded on the frozen reference host by release_freeze.py; a hosted
    # runner cannot reproduce those measurements.  This job therefore records
    # the portable CI layer it can genuinely prove: the PR gate (static
    # coverage + claims diff + targeted pytest), the full non-browser suite,
    # and the runner/command/input provenance.  It is NOT the self-hosted/lima
    # nightly; that job below stays inert unless the operator enables it.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system tools (binutils, clang)
        run: sudo apt-get update && sudo apt-get install -y binutils clang
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Portable PR gate (static coverage + claims + targeted pytest)
        run: |
          mkdir -p artifacts/release-gate-ci
          python scripts/release_gate.py --pr --json \
            > artifacts/release-gate-ci/pr-gate.json
      - name: Full non-browser pytest suite (serial)
        run: |
          python -m pytest -q -p no:xdist --ignore=tests/e2e \
            --junitxml=artifacts/release-gate-ci/pytest.xml
      - name: Assemble portable CI evidence bundle
        if: always()
        run: |
          python scripts/build_ci_evidence.py \
            --out artifacts/release-gate-ci/ci-evidence.json \
            --pr-json artifacts/release-gate-ci/pr-gate.json \
            --pytest-junit artifacts/release-gate-ci/pytest.xml || true
      - name: Record hosted CI summary
        if: always()
        run: |
          {
            echo "## Hosted portable CI evidence"
            echo ""
            echo "- run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- ref: \`${{ github.ref }}\`"
            echo "- job status: \`${{ job.status }}\`"
            echo "- scope: PR gate + full non-browser pytest; NOT host-specific"
            echo "  release measurements or the Lima nightly."
            echo "- evidence: artifact \`release-gate-hosted-evidence\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload hosted portable CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-hosted-evidence
          path: artifacts/release-gate-ci/
          if-no-files-found: warn

  release-drift:
    # Daily release-drift alarm: compare the release tag, mainline and the
    # evidence-branch gate evidence.  This is an ALARM, not release evidence:
    # a red run means "tag/evidence review is due", not that a release passed.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch mainline and release tags
        run: |
          git fetch --tags --force origin
          git fetch --force origin workbench-v3:refs/remotes/origin/workbench-v3
      - name: Check release drift (tag vs mainline vs evidence)
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || 'release-2026-11-15' }}
        run: |
          mkdir -p artifacts/release-drift
          set +e
          python scripts/release_drift_check.py --tag "$RELEASE_TAG" --json \
            > artifacts/release-drift/drift.json
          rc=$?
          cat artifacts/release-drift/drift.json || true
          {
            echo "## Release drift"
            echo ""
            echo "- tag: \`$RELEASE_TAG\`"
            echo "- run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- drift exit code: \`$rc\`"
            echo "- note: drift alarm only, not release evidence."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Upload drift report (alarm artifact, not release evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-drift-report
          path: artifacts/release-drift/
          if-no-files-found: warn

  browser-e2e:
    # Browser end-to-end suite (tests/e2e, Chrome/DevTools protocol).
    # Best-effort Chromium install with no secrets and no third-party actions.
    # IMPORTANT: the repository CDP helper (tests/e2e/cdp.py) probes macOS and
    # Windows browser paths only; on this Linux runner the suite records an
    # explicit pytest skip (visible via -rs).  A skip is NOT a pass and this job
    # is not release evidence: Linux skips are not release evidence.  The
    # release browser evidence is the macOS/Chrome local run recorded under
    # artifacts/browser-e2e-2026-11-14/ (see
    # docs/operations/release-gate-2026-11-14.md section 15).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install Chromium (best effort, no secrets)
        run: |
          if command -v chromium >/dev/null 2>&1 || command -v google-chrome >/dev/null 2>&1; then
            echo "system browser already present"
          else
            sudo apt-get update
            sudo apt-get install -y chromium               || sudo apt-get install -y chromium-browser               || echo "WARNING: no system Chromium installable; browser e2e will skip with an explicit reason"
          fi
      - name: Browser e2e (serial, explicit skip reasons)
        run: python -m pytest -q -p no:xdist tests/e2e -rs
      - name: Browser e2e status note (never a release claim)
        if: always()
        run: |
          echo "browser-e2e: Linux CI records explicit pytest skips when no"
          echo "supported browser path is available; a skip is not a pass."
          echo "Release browser evidence is captured separately on macOS/Chrome."

  release-nightly-gate:
    # Full release/nightly gate (scripts/release_gate.py --release / --nightly).
    # It requires a self-hosted runner with the Lima VM `binaryrepair`
    # (x86-64 guest execution through qemu-user/binfmt) and the real PoC
    # differential fixtures (run serially: Lima is a single-instance resource;
    # flaky reruns are not accepted as a pass).  No such runner is guaranteed for this repository,
    # so the job is *inert by default*: the repository variable
    # BINARYREPAIR_RELEASE_GATE must be set to "true" by an operator who has
    # provisioned the runner.  This file does not claim the job has ever run;
    # a skipped job is not evidence.  When enabled, schedule/manual runs call
    # --nightly, which additionally captures a fresh real-Lima acceptance run
    # into a temporary directory (repository artifacts are never rewritten) and
    # degrades to an explicit `unavailable` check when no guest runner exists.
    if: ${{ vars.BINARYREPAIR_RELEASE_GATE == 'true' }}
    runs-on: [self-hosted, lima]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # The frozen tree is this Actions checkout: --release-sha pins the gate to
      # github.sha (the gate fails on a dirty/moved tree), and --evidence-out
      # writes the gate JSON summary next to stdout for artifact upload.  The
      # evidence file is uploaded only when the job actually runs; a skipped job
      # is not evidence and this file does not claim a run has happened.
      # Do NOT mkdir the evidence directory here: an untracked directory makes
      # the checkout dirty and the gate's clean-tree check would fail.
      # --evidence-out creates the parent directory itself.
      - name: Release gate (push / pull request / manual)
        if: ${{ github.event_name != 'schedule' }}
        run: |
          python scripts/release_gate.py --release \
            --release-sha ${{ github.sha }} \
            --evidence-out artifacts/release-gate-ci/evidence.json
      - name: Nightly gate (release checks + fresh real-Lima acceptance capture)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python scripts/release_gate.py --nightly \
            --release-sha ${{ github.sha }} \
            --evidence-out artifacts/release-gate-ci/evidence.json
      - name: Upload release-gate evidence (never a release claim by itself)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: artifacts/release-gate-ci/
          if-no-files-found: warn
