name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system assembler
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Static syntax gate (no dependencies)
        run: python scripts/check_static_syntax.py
      - name: CI evidence claims (offline)
        run: python scripts/verify_ci_evidence.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run non-browser tests
        run: python -m pytest -q --ignore=tests/e2e
