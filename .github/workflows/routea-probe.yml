name: routea-cave-probe
on:
  push:
    branches: [member-5/routea-probe]
permissions:
  contents: write
jobs:
  routea-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyelftools capstone
          sudo apt-get update
          sudo apt-get install -y binutils
          chmod +x fixtures/public/CWE121_src_char_declare_cpy_51b/original.elf
      - name: Build cave probe
        run: |
          mkdir -p routea/out
          python -m routea.cave build \
            --elf fixtures/public/CWE121_src_char_declare_cpy_51b/original.elf \
            --contract fixtures/public/CWE121_src_char_declare_cpy_51b/contract.cave-probe.json \
            --cave 0x4018e9 --cave-size 1815 \
            --out routea/out/cave-probe.elf \
            --manifest routea/out/edit-manifest.json \
            --scope-authorized
          chmod +x routea/out/cave-probe.elf
      - name: Independent readelf audit
        run: |
          {
            uname -a
            python --version
            readelf --version | head -1
            sha256sum fixtures/public/CWE121_src_char_declare_cpy_51b/original.elf routea/out/cave-probe.elf
            readelf -lW routea/out/cave-probe.elf
            readelf -SW routea/out/cave-probe.elf
            readelf -rW routea/out/cave-probe.elf
          } > routea/out/readelf-audit.txt 2>&1
          cat routea/out/readelf-audit.txt
      - name: Static audit
        run: |
          python -m routea.cave audit \
            --original fixtures/public/CWE121_src_char_declare_cpy_51b/original.elf \
            --patched routea/out/cave-probe.elf \
            --contract fixtures/public/CWE121_src_char_declare_cpy_51b/contract.cave-probe.json \
            --cave 0x4018e9 --cave-size 1815 \
            --out routea/out/audit.json
      - name: Six-case runtime probe
        id: six
        continue-on-error: true
        run: |
          python routeb/run_manifest_repaired.py \
            --binary routea/out/cave-probe.elf \
            --tests fixtures/public/CWE121_src_char_declare_cpy_51b/tests \
            --out routea/out/manifest-repaired.json 2>&1 | tee routea/out/runtime.log
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "routea-probe"
          git config user.email "routea-probe@users.noreply.github.com"
          git checkout -B routea-probe-results
          git add -f routea/out
          git commit -m "routea-probe: run ${GITHUB_RUN_ID}" || echo "no changes"
          git push --force origin HEAD:routea-probe-results
      - name: Gate 3 probe result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("routea/out/manifest-repaired.json")
          if not p.exists():
              raise SystemExit("routea-probe: no manifest-repaired.json")
          d = json.loads(p.read_text())
          print(f"repaired={d['passed']}/{d['total']} pass={d['repaired_pass']}")
          raise SystemExit(0 if d["repaired_pass"] else 1)
          PY
