name: Ubuntu verification

on:
  workflow_dispatch:
  push:
    branches: [workbench-v3]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
          readelf --version
          objdump --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run fixture staging regression
        shell: bash
        run: |
          mkdir -p artifacts/ubuntu-verification
          set -o pipefail
          python -m pytest -q -vv \
            tests/test_fixture_v3_manifest.py::test_original_is_v0_on_invalid_inputs_if_binary_present \
            --junitxml=artifacts/ubuntu-verification/fixture-junit.xml \
            2>&1 | tee artifacts/ubuntu-verification/fixture-regression.log

      - name: Run non-browser test suite
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/ubuntu-verification
          set -o pipefail
          python -m pytest -q --ignore=tests/e2e \
            --junitxml=artifacts/ubuntu-verification/junit.xml \
            2>&1 | tee artifacts/ubuntu-verification/pytest.log

      - name: Annotate first pytest failure
        if: failure()
        shell: bash
        run: |
          line="$(grep -m1 '^FAILED ' artifacts/ubuntu-verification/pytest.log || true)"
          if [ -z "$line" ]; then line="$(tail -n 8 artifacts/ubuntu-verification/pytest.log | tr '\n' ' ')"; fi
          echo "::error title=Ubuntu pytest failure::${line}"

      - name: Publish test counts
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          lines = ["## Ubuntu test counts", ""]
          for name in ("fixture-junit.xml", "junit.xml"):
              path = Path("artifacts/ubuntu-verification") / name
              try:
                  root = ET.parse(path).getroot()
              except (OSError, ET.ParseError) as exc:
                  lines.append(f"- `{name}`: unavailable ({type(exc).__name__})")
                  continue
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              tests = sum(int(item.get("tests", 0)) for item in suites)
              failures = sum(int(item.get("failures", 0)) for item in suites)
              errors = sum(int(item.get("errors", 0)) for item in suites)
              skipped = sum(int(item.get("skipped", 0)) for item in suites)
              passed = tests - failures - errors - skipped
              summary_line = (
                  f"{name}: {passed} passed / {skipped} skipped / "
                  f"{failures + errors} failed / {tests} total"
              )
              lines.append(f"- `{name}`: {passed} passed / {skipped} skipped / "
                           f"{failures + errors} failed / {tests} total")
              print(f"::notice title=Ubuntu test counts::{summary_line}")
              for case in root.iter("testcase"):
                  skipped_node = case.find("skipped")
                  if skipped_node is not None:
                      message = (skipped_node.get("message") or "").strip()
                      lines.append(f"  - skipped: `{case.get('classname')}::{case.get('name')}`"
                                   + (f" — {message}" if message else ""))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Capture environment
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/ubuntu-verification
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
            echo "uname=$(uname -a)"
            echo "readelf=$(readelf --version | head -1)"
            echo "objdump=$(objdump --version | head -1)"
          } > artifacts/ubuntu-verification/environment.txt
          python -m pip freeze > artifacts/ubuntu-verification/pip-freeze.txt
          python - <<'PY'
          import json, platform, subprocess
          payload = {
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": platform.python_version(),
              "platform": platform.platform(),
              "machine": platform.machine(),
              "readelf": subprocess.check_output(["readelf", "--version"], text=True).splitlines()[0],
          }
          open("artifacts/ubuntu-verification/environment.json", "w").write(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Checksums
        if: always()
        shell: bash
        run: |
          cd artifacts/ubuntu-verification
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS || true
          cat SHA256SUMS

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-verification
          path: artifacts/ubuntu-verification
          if-no-files-found: warn
