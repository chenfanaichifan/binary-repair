name: Bug report
description: Report a reproducible defect in BinaryRepair.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include client binaries, secrets, private keys or private logs.
        For security issues use the private security advisory flow.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v1.1.0 or dcda3f6
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Commands and inputs needed to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, browser/guest details if relevant.
